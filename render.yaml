services:
  - type: web
    name: clinical-discharge-agent
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: LLM_API_KEY
        sync: false
        placeholder: "Enter your API key here (starts with sk-, sk-ant-, gsk_, or AIzaSy)"
      - key: LLM_PROVIDER
        sync: false
        placeholder: "Optional: Leave empty for auto-detection"
      - key: LLM_MODEL_NAME
        sync: false
        placeholder: "Optional: Leave empty for default model"
